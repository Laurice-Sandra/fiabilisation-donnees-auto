[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fiabilisation-donnees-auto"
version = "0.1.0"
description = "Pipeline de fiabilisation contrats x sinistres auto (freMTPL2)"
requires-python = ">=3.11"
dependencies = [
    "pandas",
    "scikit-learn",
    "pyyaml",
    "pyspark",
]

# Déclare le dossier src/ comme le package Python "src".
# Après "pip install -e .", `import src...` fonctionne depuis n'importe
# quel dossier, sans manipuler sys.path ni deviner la racine du projet.
[tool.setuptools]
packages = ["src"]
